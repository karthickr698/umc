services:
  mongo:
    image: mongo:7
    container_name: umc-mongo
    restart: unless-stopped
    # Single-node replica set: MongoDB only supports transactions on replica sets.
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    # Also initiates the replica set on first start.
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) }"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
